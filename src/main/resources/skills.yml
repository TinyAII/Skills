# Skills 技能系统 - 技能线配置
# 能力解锁节奏（全局统一，老板定稿）：
#   ability-1: 1级起每5级 | ability-2: 9级起每8级 | ability-3: 18级起每10级
#   ability-4: 31级起每15级 | ability-5: 50级起每20级（满级80只升1次）
# 每能力字段：name 显示名 / desc 效果描述（详情页展示给玩家）/ unlock 解锁等级 / every 升档间隔 / base 基础值 / per 每档增量 / max-level 能力最高档(0=不限)
skills:
  mining:
    ability-1: { name: "幸运矿工", desc: "挖矿时概率双倍掉落（矿石/石料翻倍）", unlock: 1, every: 5, base: 5, per: 5, max-level: 0 }
    ability-2: { name: "矿工经验", desc: "挖矿获得经验值加成（升级更快）", unlock: 9, every: 8, base: 10, per: 10, max-level: 0 }
    ability-3: { name: "镐精通", desc: "挖掘速度提升（挖得更快）", unlock: 18, every: 10, base: 3, per: 2, max-level: 0 }
    ability-4: { name: "矿洞耐力", desc: "工具耐久消耗降低（偶尔免扣耐久）", unlock: 31, every: 15, base: 1, per: 1, max-level: 0 }
    ability-5: { name: "硬化护甲", desc: "穿戴盔甲受伤减免", unlock: 50, every: 20, base: 3, per: 3, max-level: 0 }
