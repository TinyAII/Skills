# Skills 经验值配置
# 各行为获得经验值（改完 /技能 重载 生效）
# 说明：矿石按价值分档；行为经验会再乘"第2能力位 经验倍率"加成
# ⚠️ 平衡原则：垃圾行为（石头/树叶）≈不给经验，资源行为按价值给，越高价值越多

xp:
  # ⛏ 矿工线
  mining:
    high-ore: 12        # 高价值矿石（钻石/绿宝石/远古残骸）
    mid-ore: 5          # 中价值矿石（铁/金/铜/下界石英/青金石/红石）
    low-ore: 2          # 低价值矿石（煤等）
    stone: 0.3          # 石头类（石头/深板岩/圆石/安山岩）——白嫖行为几乎不给
  # ⚔ 战斗线
  fighting:
    kill: 8
  # 🏹 弓术线
  archery:
    kill: 8
  # 🪵 伐木线
  foraging:
    log: 6
    leaf: 0.2           # 树叶——白嫖行为几乎不给
  # 🌾 农艺线
  farming:
    crop: 5
  # 🎣 渔夫线
  fishing:
    catch: 10
  # 🧪 炼药线
  brewing:
    take: 10
  # 🛡 防御线
  defense:
    hit: 3

# 升级所需经验曲线（分段递增：前期轻松、后期变难）
# 公式：需要 = base + 累计段内斜率×等级
leveling:
  base: 150                 # 1级升2级需要 150
  increment-lv1-10: 25      # 1~10级：每级 +25（升级快，新手友好）
  increment-lv11-30: 45     # 11~30级：每级 +45（中等）
  increment-lv31-50: 70     # 31~50级：每级 +70（变难）
  increment-lv51-80: 110    # 51~80级：每级 +110（非常难，满级是长期目标）